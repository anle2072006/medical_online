# Chay toan bo he thong: docker compose up --build   (mo http://localhost:8080)
x-svc: &svc
  build: .
  image: sina-clinic
  restart: unless-stopped
  depends_on:
    rabbitmq: { condition: service_healthy }
    mongo: { condition: service_healthy }
  environment: &env
    RABBITMQ_URL: amqp://rabbitmq
    MONGO_URL: mongodb://mongo:27017
    JWT_SECRET: ${JWT_SECRET:?Hay dat JWT_SECRET trong file .env}
    INTERNAL_KEY: ${INTERNAL_KEY:?Hay dat INTERNAL_KEY trong file .env}
    WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Hay dat WEBHOOK_SECRET trong file .env}
    DEMO_MODE: ${DEMO_MODE:-true}
    TZ: Asia/Ho_Chi_Minh
    IDENTITY_URL: http://identity:3001
    SCHEDULING_URL: http://scheduling:3002
    BILLING_URL: http://billing:3003
    RECORDS_URL: http://records:3004
    TELE_URL: http://tele:3005
    NOTIFY_URL: http://notify:3006
    MOCK_URL: http://mock-externals:4000

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["15673:15672"]   # giao dien quan tri RabbitMQ: http://localhost:15673 (guest / guest)
    healthcheck: { test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 10s, timeout: 10s, retries: 12 }

  mongo:
    image: mongo:7
    volumes: ["mongo-data:/data/db"]
    ports: ["27030:27017"]  
    healthcheck: { test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"], interval: 10s, timeout: 10s, retries: 12 }

  mock-externals: { <<: *svc, command: ["node", "services/mock-externals/index.js"], environment: { <<: *env, VNPAY_REQUIRE_OTP: "${VNPAY_REQUIRE_OTP:-true}" }, healthcheck: { test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 10s, timeout: 5s, retries: 12, start_period: 10s } }
  identity:
    <<: *svc
    command: ["node", "services/identity/index.js"]
    environment: { <<: *env, LICENSE_CHECK_MS: "60000", EXPOSE_DEV_OTP: "${EXPOSE_DEV_OTP:-false}" }   # EXPOSE_DEV_OTP chi bat khi chay kiem thu tu dong
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 10s, timeout: 5s, retries: 12, start_period: 10s }
  scheduling: { <<: *svc, command: ["node", "services/scheduling/index.js"], healthcheck: { test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 10s, timeout: 5s, retries: 12, start_period: 10s } }
  billing:    { <<: *svc, command: ["node", "services/billing/index.js"], healthcheck: { test: ["CMD", "node", "-e", "fetch('http://localhost:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 10s, timeout: 5s, retries: 12, start_period: 10s } }
  records:    { <<: *svc, command: ["node", "services/records/index.js"], healthcheck: { test: ["CMD", "node", "-e", "fetch('http://localhost:3004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 10s, timeout: 5s, retries: 12, start_period: 10s } }
  tele:       { <<: *svc, command: ["node", "services/tele/index.js"], healthcheck: { test: ["CMD", "node", "-e", "fetch('http://localhost:3005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 10s, timeout: 5s, retries: 12, start_period: 10s } }
  notify:
    <<: *svc
    command: ["node", "services/notify/index.js"]
    environment:
      <<: *env
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://localhost:3006/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 10s, timeout: 5s, retries: 12, start_period: 10s }
  gateway:
    <<: *svc
    command: ["node", "services/gateway/index.js"]
    ports: ["8080:8080"]
    environment: { <<: *env, ALLOW_MOCK_ADMIN: "${ALLOW_MOCK_ADMIN:-false}" }   # true chi khi demo/kiem thu: cho phep thu hoi giay phep gia lap
    depends_on:
      rabbitmq: { condition: service_healthy }
      mongo: { condition: service_healthy }
      identity: { condition: service_healthy }
      scheduling: { condition: service_healthy }
      billing: { condition: service_healthy }
      records: { condition: service_healthy }
      tele: { condition: service_healthy }
      notify: { condition: service_healthy }
      mock-externals: { condition: service_healthy }
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 10s, timeout: 5s, retries: 12, start_period: 10s }

volumes: { mongo-data: {} }
